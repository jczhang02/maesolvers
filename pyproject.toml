[project]
name = "maesolvers"
version = "0.1.0"
description = "Solvers for the Monge-Ampere equation: classical and neural methods behind one interface"
readme = "README.md"
license = "MIT"
authors = [{ name = "JC Zhang" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# The neural solvers (ADR 0006, 0008); imported only when a neural solver solves.
neural = ["torch", "lightning>=2"]
# Configs and the `maesolvers solve` command line (ADR 0005); imported only by
# maesolvers.from_config and maesolvers.cli. CI and `just check` add it with --extra cli.
cli = ["jsonargparse[signatures]>=4.49"]

[project.scripts]
maesolvers = "maesolvers.cli:main"

[project.urls]
Repository = "https://github.com/jczhang02/maesolvers"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.400",
    "pytest>=8",
    "ruff>=0.6",
]
# Experiment logging on a100server (see CLAUDE.md, Experiments); not a library dependency.
experiments = ["mlflow>=3.4"]
# The neural extra with the CPU build of torch, for CI and `just check` on machines
# without a GPU: the torch wheel on PyPI pulls the multi-GB CUDA libraries.
neural-cpu = ["torch", "lightning>=2"]

[tool.uv]
# The lock (not the published metadata) pins torch 2.7.1: newer wheels need a
# CUDA driver newer than a100server's 12.6. Users install any torch they like.
constraint-dependencies = ["torch==2.7.1"]
# The neural extra takes torch from PyPI (the CUDA 12.6 build, installed on
# a100server through its mirror); the neural-cpu group takes the CPU build.
conflicts = [[{ extra = "neural" }, { group = "neural-cpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "neural-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maesolvers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "neural: needs the neural extra (torch, lightning); deselect with -m 'not neural'",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
# The oldest Python the package supports, whatever the interpreter running pyright.
pythonVersion = "3.10"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501", "B", "UP", "SIM", "RUF", "D"]
# E741: the mathematics names variables l and I. D105: a dunder method does what
# Python defines; __post_init__ validates, and the class docstring's Raises says how.
ignore = ["E741", "D105"]

[tool.ruff.lint.per-file-ignores]
# Docstrings are required of the library (src/), not of its tests and scripts.
"tests/**" = ["D"]
"benchmarks/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-line-length = 100
