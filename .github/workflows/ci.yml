name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # Without extras (ADR 0006): the core and every classical solver.
      - run: uv run --exact pytest -q
      # With the cli extra: from_config and the command line.
      - run: uv sync --group dev --extra cli
      - run: uv run --exact --extra cli pytest -q
