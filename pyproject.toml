[project]
name = "maesolvers"
version = "0.0.1"
description = "Solvers for the Monge-Ampere equation: classical and neural methods behind one interface"
readme = "README.md"
license = "MIT"
authors = [{ name = "JC Zhang" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# Declared for the neural solvers to come; nothing in 0.0.x imports torch.
neural = ["torch"]

[project.urls]
Repository = "https://github.com/jczhang02/maesolvers"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maesolvers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]
ignore = ["E741"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100
